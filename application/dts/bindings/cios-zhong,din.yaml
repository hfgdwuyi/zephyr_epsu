# cios-zhong digital input binding
#
# Custom compatible because these are industrial switch/status inputs
# — not key/button inputs (gpio-keys expects zephyr,code events).

description: cios-zhong DIN configuration node
compatible: "cios-zhong,din"

child-binding:
    description: Single DIN pin (switch / status / fault input)
    properties:
        reg:
            type: array
            description: DIN index (must stay dense 0..N-1)
            required: true
        gpios:
            type: phandle-array
            required: true
