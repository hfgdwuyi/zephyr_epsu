# Minimal test app — MCUboot dual-slot OTA verification
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_PRINTK=y
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_REBOOT=y
CONFIG_POSIX_API=y
CONFIG_STM32H7_BOOT_M4_AT_INIT=n
CONFIG_INIT_ARCH_HW_AT_BOOT=y
CONFIG_HEAP_MEM_POOL_SIZE=32768
# Keep caches disabled — soc_early_init_hook() enables them but
# without MPU configured yet, Cortex-M7 D-Cache causes boot crash
CONFIG_ICACHE=n
CONFIG_DCACHE=n
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_MCUBOOT_IMGTOOL_SIGN_VERSION="0.0.0"

# Networking (mirrors zephyr_epsu reference config)
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_CONNECTION_MANAGER=y

# Eventfd + poll
CONFIG_EVENTFD=y
CONFIG_ZVFS_EVENTFD_MAX=8
CONFIG_ZVFS_POLL_MAX=32

# Network buffers (reference uses higher values)
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=128
CONFIG_NET_BUF_TX_COUNT=128
CONFIG_NET_CONTEXT_NET_PKT_POOL=y
CONFIG_NET_MAX_CONTEXTS=32
CONFIG_NET_MAX_CONN=32

# Static IPv4 + IPv6
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_NEED_IPV6=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.0.2.1"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
CONFIG_NET_CONFIG_MY_IPV4_GW="192.0.2.2"
CONFIG_NET_CONFIG_MY_IPV6_ADDR="2001:db8::1"
CONFIG_NET_CONFIG_PEER_IPV6_ADDR="2001:db8::2"
CONFIG_NET_DHCPV4=n

# DNS (for hostname resolution in OTA download)
CONFIG_DNS_RESOLVER=y

# HTTP server + client
CONFIG_HTTP_PARSER_URL=y
CONFIG_HTTP_PARSER=y
CONFIG_HTTP_SERVER=y
CONFIG_HTTP_SERVER_VERSION_1=y
CONFIG_HTTP_SERVER_VERSION_2=n
CONFIG_HTTP_CLIENT=y

# TCP tweak for fast consecutive connections
CONFIG_NET_TCP_TIME_WAIT_DELAY=0

# GPIO (LED control)
CONFIG_GPIO=y

# JSON
CONFIG_JSON_LIBRARY=y

# Logging
CONFIG_LOG=y
