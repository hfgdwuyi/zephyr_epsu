# CiosZhong PSU — minimal application configuration (no MCUboot, no Ethernet)
# Booted by MCUboot from slot0; image is signed and has the MCUboot header
CONFIG_BOOTLOADER_MCUBOOT=y
# Full application mode (LED blink bring-up is disabled):
#   CONFIG_CIOS_ZHONG_BRINGUP=n restores state machine / sensors / uart_cmd
CONFIG_CIOS_ZHONG_BRINGUP=n
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_PRINTK=y
# UART 中断驱动 — uart_cmd 上位机命令服务（USART3 RX 中断）依赖
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_REBOOT=y
CONFIG_STM32H7_BOOT_M4_AT_INIT=n
CONFIG_INIT_ARCH_HW_AT_BOOT=y
CONFIG_HEAP_MEM_POOL_SIZE=32768
# Keep caches disabled — soc_early_init_hook() enables them but
# without MPU configured yet, Cortex-M7 D-Cache causes boot crash
CONFIG_ICACHE=n
CONFIG_DCACHE=n
CONFIG_MAIN_STACK_SIZE=32768
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# GPIO (LED control)
CONFIG_GPIO=y

# NOTE: Zephyr 4.x GPIO callback/EXTI API (gpio_pin_interrupt_configure_dt,
# gpio_add_callback) is always compiled in — no CONFIG_GPIO_INTERRUPT symbol.
# The zero_en zero-crossing input (acmeter) uses it directly.

# CAN bus (CANopen)
CONFIG_CAN=y

# Watchdog
CONFIG_WATCHDOG=y

# PWM (fan control)
CONFIG_PWM=y

# ADC (analog inputs)
CONFIG_ADC=y

# DAC (analog outputs)
CONFIG_DAC=y

# JSON
CONFIG_JSON_LIBRARY=y

# Logging
CONFIG_LOG=y

# ================= I2C 外设驱动（24C04 EEPROM）=================
# EEPROM_AT24 由 DT 节点自动使能并 select EEPROM_AT2X+I2C
CONFIG_I2C=y
CONFIG_EEPROM=y

# DFU: 提供 boot_request_upgrade()（MCUboot swap 请求）
CONFIG_MCUBOOT_IMG_MANAGER=y

# STREAM_FLASH: IMG_MANAGER 依赖
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
