# MCUboot bootloader v1.0.0 (SWAP_USING_OFFSET layout, 2026-09-08 verified)
# MCUboot extra config — mirror the working Ethernet-upgrade reference
# project (build_epsu): swap-using-offset, no scratch partition required.
CONFIG_BOOT_PREFER_SWAP_OFFSET=y
CONFIG_BOOT_SWAP_USING_SCRATCH=n
CONFIG_BOOT_SWAP_USING_OFFSET=y
# 静默 MCUboot 启动日志（包括 ERR 级调试刷屏 swap_offset/app_max_size），
# 升级过程无日志即可见结果；保留 app 自身打印。
CONFIG_MCUBOOT_LOG_LEVEL_OFF=y
