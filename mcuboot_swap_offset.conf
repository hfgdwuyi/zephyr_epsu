# MCUboot bootloader v1.0.1 (OVERWRITE_ONLY layout, 2026-09-09)
# Upgrade strategy: overwrite - MCUboot copies slot1 over slot0.
# No automatic rollback, but a failed upgrade can be re-flashed via DFU.
CONFIG_BOOT_UPGRADE_ONLY=y
# An overwrite upgrade erases the whole primary slot and then copies the
# image into it. That takes longer than the external MAX6703A watchdog
# (1.6 s) allows, and MCUboot only calls its patched feed function from
# the erase/copy loops when this is enabled - without it the copy is
# interrupted half way and the application never starts.
CONFIG_BOOT_WATCHDOG_FEED=y
CONFIG_BOOT_SWAP_USING_SCRATCH=n
CONFIG_BOOT_SWAP_USING_OFFSET=n
# Keep the MCUboot log at INFO: it prints "Erasing the primary slot"
# before an overwrite upgrade, which is the evidence needed if an
# upgrade ever erases the wrong region. Set to OFF to silence it.
CONFIG_MCUBOOT_LOG_LEVEL_INF=y
