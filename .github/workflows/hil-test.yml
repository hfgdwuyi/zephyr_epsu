name: HIL Test (Hardware-in-the-Loop)

on:
  push:
    branches: [main, feature/*]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hil-test
  cancel-in-progress: false

jobs:
  build-ota-verify:
    name: Build → OTA → Verify
    runs-on: [self-hosted, nucleo-h745zi]
    timeout-minutes: 30

    env:
      ZEPHYR_BASE: /Users/mac/project/02_zephyr/zephyrproject/zephyr
      ZEPHYR_SDK_INSTALL_DIR: /Users/mac/project/02_zephyr/zephyr-sdk-1.0.1
      DEVICE_IP: 192.0.2.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build firmware
        run: |
          export ZEPHYR_BASE="${{ env.ZEPHYR_BASE }}"
          export ZEPHYR_SDK_INSTALL_DIR="${{ env.ZEPHYR_SDK_INSTALL_DIR }}"
          source "$ZEPHYR_BASE/zephyr-env.sh"
          west build \
            -d "${{ runner.temp }}/build" \
            "${{ github.workspace }}/application" \
            -b nucleo_h745zi_q/stm32h745xx/m7 \
            --sysbuild
        timeout-minutes: 15

      - name: Wait for device
        run: |
          echo "Waiting for device at ${{ env.DEVICE_IP }}..."
          for i in $(seq 1 30); do
            if curl -s --connect-timeout 2 "http://${{ env.DEVICE_IP }}/api/v1/status/heartbeat" 2>/dev/null | grep -q '{}'; then
              echo "Device ready after ${i}s"
              exit 0
            fi
            printf "."
            sleep 1
          done
          echo ""
          echo "ERROR: Device did not come online within 30s"
          exit 1

      - name: Record pre-OTA version
        run: |
          echo "=== Pre-OTA Device State ==="
          curl -s "http://${{ env.DEVICE_IP }}/api/v1/status/uptime" | python3 -m json.tool
          echo ""
          V1_BIN="${{ runner.temp }}/build/application/zephyr/zephyr.signed.bin"
          echo "OTA image: $V1_BIN"
          echo "OTA image size: $(stat -f%z "$V1_BIN" 2>/dev/null || wc -c < "$V1_BIN") bytes"

      - name: OTA update
        run: |
          V1_BIN="${{ runner.temp }}/build/application/zephyr/zephyr.signed.bin"
          echo "Starting OTA update..."
          python3 "${{ github.workspace }}/scripts/ota_e2e_test.py" \
            --image "$V1_BIN" \
            --host "${{ env.DEVICE_IP }}" \
            --timeout 120
        timeout-minutes: 5

      - name: Wait for device after OTA reboot
        run: |
          echo "Waiting for device to reboot after OTA..."
          for i in $(seq 1 30); do
            if curl -s --connect-timeout 2 "http://${{ env.DEVICE_IP }}/api/v1/status/heartbeat" 2>/dev/null | grep -q '{}'; then
              echo "Device back online after ${i}s"
              exit 0
            fi
            printf "."
            sleep 1
          done
          echo ""
          echo "ERROR: Device did not come back after OTA reboot"
          exit 1

      - name: Verify new firmware
        run: |
          echo "=== Post-OTA Device State ==="
          UPTIME=$(curl -s "http://${{ env.DEVICE_IP }}/api/v1/status/uptime" | python3 -c "import sys,json; print(json.load(sys.stdin)['uptime_ms'])" 2>/dev/null)
          echo "Uptime: ${UPTIME} ms (${UPTIME}ms < 60000ms → fresh boot)"
          if [ -n "$UPTIME" ] && [ "$UPTIME" -lt 60000 ]; then
            echo "PASS: Firmware is running a fresh boot (version confirmed via OTA swap)"
          else
            echo "FAIL: Uptime is $UPTIME ms, expected < 60000 ms after OTA reboot"
            exit 1
          fi

      - name: Summary
        if: always()
        run: |
          echo "============================================"
          echo " HIL Test Complete"
          echo " Build artifacts: ${{ runner.temp }}/build"
          echo "============================================"
