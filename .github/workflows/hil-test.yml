name: HIL Test (Hardware-in-the-Loop)

on:
  push:
    branches: [main, feature/*]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hil-test
  cancel-in-progress: false

jobs:
  build-ota-verify:
    name: Build → OTA → Verify
    runs-on: [self-hosted, nucleo-h745zi]
    timeout-minutes: 45

    env:
      ZEPHYR_BASE: /Users/mac/project/02_zephyr/zephyrproject/zephyr
      ZEPHYR_SDK_INSTALL_DIR: /Users/mac/project/02_zephyr/zephyr-sdk-1.0.1
      DEVICE_IP: 192.0.2.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate version
        run: |
          VERSION=$(cat "${{ github.workspace }}/VERSION")
          echo "Firmware version: ${VERSION}"
          if ! echo "${VERSION}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: VERSION file must contain MAJOR.MINOR.PATCH (e.g. 0.1.0)"
            exit 1
          fi
          echo "Version format: OK"

      - name: Build Application firmware
        run: |
          export ZEPHYR_BASE="${{ env.ZEPHYR_BASE }}"
          export ZEPHYR_SDK_INSTALL_DIR="${{ env.ZEPHYR_SDK_INSTALL_DIR }}"
          source "$ZEPHYR_BASE/zephyr-env.sh"
          west build \
            -d "${{ runner.temp }}/build_app" \
            "${{ github.workspace }}/application" \
            -b nucleo_h745zi_q/stm32h745xx/m7 \
            --sysbuild
        timeout-minutes: 15

      - name: Build Bootloader firmware
        run: |
          export ZEPHYR_BASE="${{ env.ZEPHYR_BASE }}"
          export ZEPHYR_SDK_INSTALL_DIR="${{ env.ZEPHYR_SDK_INSTALL_DIR }}"
          source "$ZEPHYR_BASE/zephyr-env.sh"
          west build \
            -d "${{ runner.temp }}/build_bl" \
            "${{ github.workspace }}/bootloader" \
            -b nucleo_h745zi_q/stm32h745xx/m7 \
            --sysbuild
        timeout-minutes: 15

      - name: Stage firmware images
        run: |
          mkdir -p "${{ runner.temp }}/fw"
          cp "${{ runner.temp }}/build_app/application/zephyr/zephyr.signed.bin" \
             "${{ runner.temp }}/fw/main.signed.bin"
          cp "${{ runner.temp }}/build_bl/bootloader/zephyr/zephyr.signed.bin" \
             "${{ runner.temp }}/fw/bootloader.signed.bin"
          echo "Main App:  $(wc -c < "${{ runner.temp }}/fw/main.signed.bin") bytes"
          echo "Bootloader: $(wc -c < "${{ runner.temp }}/fw/bootloader.signed.bin") bytes"

      - name: Wait for device
        run: |
          echo "Waiting for device at ${{ env.DEVICE_IP }}..."
          for i in $(seq 1 30); do
            if curl -s --connect-timeout 2 "http://${{ env.DEVICE_IP }}/api/v1/status/heartbeat" 2>/dev/null | grep -q '{}'; then
              echo "Device ready after ${i}s"
              exit 0
            fi
            printf "."
            sleep 1
          done
          echo ""
          echo "ERROR: Device did not come online within 30s"
          exit 1

      - name: Record pre-OTA version
        run: |
          echo "=== Pre-OTA Device State ==="
          echo -n "Device version: "
          curl -s "http://${{ env.DEVICE_IP }}/api/v1/status/version"
          echo ""
          echo -n "Device uptime:  "
          curl -s "http://${{ env.DEVICE_IP }}/api/v1/status/uptime" | python3 -m json.tool
          echo ""
          echo "Main App:  ${{ runner.temp }}/fw/main.signed.bin ($(wc -c < "${{ runner.temp }}/fw/main.signed.bin") bytes)"
          echo "Bootloader: ${{ runner.temp }}/fw/bootloader.signed.bin ($(wc -c < "${{ runner.temp }}/fw/bootloader.signed.bin") bytes)"

      - name: OTA update + Bootloader swap test
        run: |
          echo "Starting OTA update with bootloader swap round-trip..."
          python3 "${{ github.workspace }}/scripts/ota_e2e_test.py" \
            --image "${{ runner.temp }}/fw/main.signed.bin" \
            --swap-image "${{ runner.temp }}/fw/bootloader.signed.bin" \
            --host "${{ env.DEVICE_IP }}" \
            --timeout 120
        timeout-minutes: 8

      - name: Wait for device after OTA reboot
        run: |
          echo "Waiting for device to reboot after OTA..."
          for i in $(seq 1 30); do
            if curl -s --connect-timeout 2 "http://${{ env.DEVICE_IP }}/api/v1/status/heartbeat" 2>/dev/null | grep -q '{}'; then
              echo "Device back online after ${i}s"
              exit 0
            fi
            printf "."
            sleep 1
          done
          echo ""
          echo "ERROR: Device did not come back after OTA reboot"
          exit 1

      - name: Verify new firmware
        run: |
          EXPECTED_VERSION=$(cat "${{ github.workspace }}/VERSION")
          DEVICE_VERSION=$(curl -s "http://${{ env.DEVICE_IP }}/api/v1/status/version" | python3 -c "import sys,json; print(json.load(sys.stdin)['version'])" 2>/dev/null)
          echo "=== Post-OTA Device State ==="
          echo "Device version:  ${DEVICE_VERSION}"
          echo "Expected version: ${EXPECTED_VERSION}"
          echo ""
          if [ "${DEVICE_VERSION}" = "${EXPECTED_VERSION}" ]; then
            echo "PASS: Version match — device is running ${DEVICE_VERSION}"
          else
            echo "FAIL: Version mismatch — device=${DEVICE_VERSION}, expected=${EXPECTED_VERSION}"
            exit 1
          fi

      - name: Summary
        if: always()
        run: |
          echo "============================================"
          echo " HIL Test Complete"
          echo " Build artifacts: ${{ runner.temp }}/build_app"
          echo " Bootloader artifacts: ${{ runner.temp }}/build_bl"
          echo "============================================"
